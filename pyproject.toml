[project]
name = "meal-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.1",
    "langchain-core>=1.2.7",
    "langchain-ollama>=1.0.1",
]

[project.scripts]
meal-planner = "meal_planner.meal_planner:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.13",
]

[tool.setuptools]
py-modules = ["meal_planner", "prompts", "grocery", "preferences"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
